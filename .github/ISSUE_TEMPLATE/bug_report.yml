name: Bug report
description: Report a reproducible OpenSw defect
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve OpenSw. Do not upload games, keys, firmware, saves, personal paths or private data.
        Security vulnerabilities must be reported privately through the Security tab.
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched the existing issues for this problem.
          required: true
        - label: I reproduced this with OpenSw, not the official Eden package.
          required: true
  - type: input
    id: build
    attributes:
      label: OpenSw build
      description: Version name or commit shown by OpenSw, for example opensw-8144ad89524b.
    validations:
      required: true
  - type: dropdown
    id: variant
    attributes:
      label: Build variant
      options:
        - Release (com.remipelloux.opensw)
        - Profile (com.remipelloux.opensw.profile)
        - Self-built debug variant
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: Device and graphics driver
      description: Include device model, Android version, SoC/GPU, Vulkan driver and OpenSw performance mode.
      placeholder: |
        Device:
        Android:
        SoC/GPU:
        Vulkan driver:
        OpenSw mode:
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the shortest deterministic sequence that reproduces the issue.
      placeholder: |
        1. Launch ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Attach an OpenSw diagnostic bundle or relevant log excerpt after checking that it contains no private or copyrighted data.
    validations:
      required: false
  - type: textarea
    id: regression
    attributes:
      label: Regression range
      description: If known, give the last working and first broken OpenSw build.
    validations:
      required: false
