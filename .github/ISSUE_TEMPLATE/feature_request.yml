name: Feature request
description: Propose a scoped OpenSw improvement
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and discussions for this proposal.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the observable behavior, controls and compatibility expectations.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing workarounds and relevant tradeoffs.
    validations:
      required: false
  - type: checkboxes
    attributes:
      label: Compatibility
      options:
        - label: The proposal preserves generic Android ARM64 support or clearly isolates device-specific behavior.
          required: true
        - label: The proposal does not require games, keys, firmware or copyrighted assets in the repository.
          required: true
