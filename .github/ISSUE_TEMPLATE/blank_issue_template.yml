name: Maintainer task
description: Track a scoped engineering or release task
title: "[Task]: "
labels: [maintenance]
body:
  - type: markdown
    attributes:
      value: Use the bug or feature template for user reports. This form is for scoped maintainer work.
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
      description: Define the observable completion condition.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and constraints
      description: Link relevant code, measurements, issues and compatibility constraints.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: List the tests, builds or device checks required before closure.
    validations:
      required: true
